// ─── Master Computation ────────────────────────────────────
function computeChart(formData) {
  try {
    const [year, month, day] = formData.dob.split('-').map(Number);
    const [hour, minute] = formData.time.split(':').map(Number);
    const lat = parseFloat(formData.lat);
    const lng = parseFloat(formData.lng);

    if (isNaN(year) || isNaN(month) || isNaN(day) || isNaN(hour) || isNaN(minute) || isNaN(lat) || isNaN(lng)) return null;

    // 1. Astronomical positions
    const positions = AstroEngine.computeAllPositions({
      year, month, day, hour, minute,
      tzOffset: 5.5, lat, lng
    });

    // 2. Build D1 chart
    const chart = VedicCore.buildChart(positions.sidereal);
    // Attach retrograde info to chart planets
    for (const [planet, retro] of Object.entries(positions.retrograde)) {
      if (chart.planets[planet]) chart.planets[planet].retrograde = retro;
    }
    // Attach combustion info
    for (const [planet, comb] of Object.entries(positions.combust)) {
      if (chart.planets[planet]) chart.planets[planet].combust = comb;
    }
    // Attach longitudes
    for (const [planet, long] of Object.entries(positions.sidereal)) {
      if (chart.planets[planet]) chart.planets[planet].longitude = long;
    }

    // 3. Build Navamsa chart
    const navamsaChart = VedicCore.buildNavamsaChart(positions.sidereal);

    // 4. Build grids for UI
    const rasiGrid = VedicCore.buildRasiGrid(chart);
    const navamsaGrid = VedicCore.buildRasiGrid(navamsaChart);

    // 5. Panchanga
    const panchanga = Panchanga.buildPanchanga(
      positions.sidereal.Sun, positions.sidereal.Moon, positions.jd
    );

    // 6. Dasha
    const dashaTimeline = DashaSystem.getMahaDashaTimeline(positions.jd, positions.sidereal.Moon);
    const now = new Date();
    const nowJD = AstroEngine.dateToJulianDay(
      now.getFullYear(), now.getMonth() + 1, now.getDate(),
      now.getHours(), now.getMinutes(), 5.5
    );
    const currentDasha = DashaSystem.getCurrentDasha(positions.jd, positions.sidereal.Moon, nowJD);

    // 7. Yogas & Doshas
    const yogaDoshaResults = YogaDosha.detectAll(chart);

    // 8. Ashtakavarga
    const ashtakavargaResult = Ashtakavarga.compute(chart);

    // 9. Interpretations
    const personality = Interpretation.interpretPersonality(chart, yogaDoshaResults);
    const career = Interpretation.interpretCareer(chart);
    const wealth = Interpretation.interpretWealth(chart, ashtakavargaResult);
    const remedies = Interpretation.interpretRemedies(chart, yogaDoshaResults);
    const insights = Interpretation.generateInsights(chart, currentDasha, ashtakavargaResult, yogaDoshaResults);
    const coreData = Interpretation.generateCoreData(chart, panchanga, currentDasha);
    const lifePredictions = Interpretation.generateLifePredictions(chart, currentDasha);

    return {
      positions, chart, navamsaChart, rasiGrid, navamsaGrid,
      panchanga, dashaTimeline, currentDasha,
      yogaDoshaResults, ashtakavargaResult,
      personality, career, wealth, remedies, insights, coreData, lifePredictions
    };
  } catch (e) {
    console.error('Chart computation error:', e);
    return null;
  }
}

const CircularProgress = ({ percentage }) => {
  const radius = 24;
  const circumference = 2 * Math.PI * radius;
  const strokeDashoffset = circumference - (percentage / 100) * circumference;
  const colorClass = percentage > 75 ? 'text-green-400' : percentage > 50 ? 'text-amber-400' : 'text-rose-400';
  return (
    <div className="relative flex items-center justify-center h-16 w-16 shrink-0">
      <svg className="w-full h-full transform -rotate-90" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r={radius} stroke="currentColor" strokeWidth="4" fill="transparent" className="text-slate-800" />
        <circle cx="32" cy="32" r={radius} stroke="currentColor" strokeWidth="4" fill="transparent" strokeDasharray={circumference} strokeDashoffset={strokeDashoffset} className={`${colorClass} transition-all duration-1000 ease-out`} strokeLinecap="round" />
      </svg>
      <span className="absolute text-xs font-bold text-white">{percentage}%</span>
    </div>
  );
};

// ─── Place Autocomplete Component ───────────────────────────
function PlaceAutocomplete({ value, onSelect, onChangeText }) {
  const [query, setQuery] = useState(value);
  const [suggestions, setSuggestions] = useState([]);
  const [isOpen, setIsOpen] = useState(false);
  const debounceRef = useRef(null);

  useEffect(() => {
    setQuery(value);
  }, [value]);

  const searchPlace = (searchText) => {
    if (!searchText || searchText.length < 3) {
      setSuggestions([]);
      return;
    }
    fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(searchText)}&limit=5`)
      .then(res => res.json())
      .then(data => {
        if (data.features) {
          const results = data.features.map(f => ({
            name: [f.properties.name, f.properties.state, f.properties.country].filter(Boolean).join(', '),
            lat: f.geometry.coordinates[1],
            lng: f.geometry.coordinates[0]
          }));
          // Filter unique names
          const unique = results.filter((v, i, a) => a.findIndex(t => (t.name === v.name)) === i);
          setSuggestions(unique);
          setIsOpen(true);
        }
      })
      .catch(err => console.error('Geocoding error:', err));
  };

  const handleInputChange = (e) => {
    const text = e.target.value;
    setQuery(text);
    onChangeText(text); // Update parent state without lat/lng
    
    if (debounceRef.current) clearTimeout(debounceRef.current);
    debounceRef.current = setTimeout(() => {
      searchPlace(text);
    }, 500);
  };

  const handleSelect = (place) => {
    setQuery(place.name);
    setSuggestions([]);
    setIsOpen(false);
    onSelect(place.name, place.lat, place.lng);
  };

  return (
    <div className="relative">
      <Search size={16} className="absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-500" />
      <input 
        type="text" 
        value={query} 
        onChange={handleInputChange} 
        onBlur={() => setTimeout(() => setIsOpen(false), 200)}
        onFocus={() => { if (suggestions.length > 0) setIsOpen(true) }}
        className="w-full bg-slate-900/50 border border-slate-700 rounded-lg pl-10 pr-4 py-3 text-slate-200 focus:outline-none focus:border-amber-500/50 transition-all" 
        placeholder="Type a city name..."
      />
      {isOpen && suggestions.length > 0 && (
        <ul className="absolute z-50 w-full mt-1 bg-slate-800 border border-slate-700 rounded-lg shadow-xl overflow-hidden">
          {suggestions.map((s, i) => (
            <li 
              key={i} 
              className="px-4 py-3 text-sm text-slate-300 hover:bg-amber-500/10 hover:text-amber-400 cursor-pointer border-b border-slate-700/50 last:border-0"
              onClick={() => handleSelect(s)}
            >
              {s.name}
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

const LifeGraph = ({ dashaTimeline, chart, ashtakavargaResult }) => {
  if (!dashaTimeline || dashaTimeline.length === 0) return null;

  const data = [];
  dashaTimeline.forEach((maha) => {
     const mahaScore = Interpretation.getPlanetScore(maha.lord, chart, ashtakavargaResult);
     const antars = window.DashaSystem.getAntarDasha(maha);
     
     antars.forEach((antar) => {
        const antarScore = Interpretation.getPlanetScore(antar.lord, chart, ashtakavargaResult);
        // Blended score: 60% Maha Lord, 40% Antar Lord
        const blendedScore = (mahaScore * 0.6) + (antarScore * 0.4);
        const year = antar.startDate.year + (antar.startDate.month / 12);
        
        data.push({ 
          year: Number(year.toFixed(2)), 
          score: Math.round(blendedScore), 
          mahaLord: maha.lord,
          antarLord: antar.lord,
          label: `${maha.lord}-${antar.lord}`,
          dateStr: antar.startDate.dateStr
        });
     });
  });
  
  // Add an endpoint to close the graph smoothly
  const lastMaha = dashaTimeline[dashaTimeline.length - 1];
  const endYear = lastMaha.endDate.year + (lastMaha.endDate.month / 12);
  const lastScore = data[data.length - 1].score;
  data.push({ year: Number(endYear.toFixed(2)), score: lastScore, mahaLord: '', antarLord: '', label: 'End', dateStr: lastMaha.endDate.dateStr });

  const CustomTooltip = ({ active, payload }) => {
    if (active && payload && payload.length) {
      return (
        <div className="bg-slate-900 border border-slate-700 p-3 rounded-lg shadow-xl backdrop-blur-md">
          <p className="text-amber-400 font-bold font-serif mb-1">{payload[0].payload.label} Dasha</p>
          <p className="text-slate-300 text-xs mb-1">Starts: <span className="font-mono text-emerald-300">{payload[0].payload.dateStr}</span></p>
          <p className="text-indigo-300 text-sm font-semibold mt-2 border-t border-slate-700 pt-2">Experience: {payload[0].value}/100</p>
        </div>
      );
    }
    return null;
  };

  return (
    <div className="mt-8 bg-slate-900/40 p-6 rounded-xl border border-slate-700/50 shadow-2xl">
       <h4 className="text-lg font-serif text-amber-400 mb-6 flex items-center gap-2">Experience Rating Trajectory</h4>
       <div className="w-full h-64">
         <ResponsiveContainer width="100%" height="100%">
           <AreaChart
             data={data}
             margin={{ top: 10, right: 10, left: -20, bottom: 0 }}
           >
             <defs>
               <linearGradient id="colorScore" x1="0" y1="0" x2="0" y2="1">
                 <stop offset="5%" stopColor="#818cf8" stopOpacity={0.4}/>
                 <stop offset="95%" stopColor="#818cf8" stopOpacity={0}/>
               </linearGradient>
             </defs>
             <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
             <XAxis dataKey="year" stroke="#94a3b8" tickFormatter={(val) => Math.floor(val)} tick={{fill: '#94a3b8', fontSize: 12}} tickMargin={10} minTickGap={30} />
             <YAxis domain={[0, 100]} stroke="#94a3b8" tick={{fill: '#94a3b8', fontSize: 12}} />
             <Tooltip content={<CustomTooltip />} />
             <ReferenceLine y={75} stroke="#10b981" strokeDasharray="3 3" opacity={0.5} label={{ position: 'insideTopRight', value: 'Excellent', fill: '#10b981', fontSize: 10 }} />
             <ReferenceLine y={50} stroke="#94a3b8" strokeDasharray="3 3" opacity={0.5} label={{ position: 'insideTopRight', value: 'Average', fill: '#94a3b8', fontSize: 10 }} />
             <ReferenceLine y={25} stroke="#f43f5e" strokeDasharray="3 3" opacity={0.5} label={{ position: 'insideTopRight', value: 'Challenging', fill: '#f43f5e', fontSize: 10 }} />
             <Area 
                type="monotone" 
                dataKey="score" 
                stroke="#818cf8" 
                strokeWidth={3}
                fillOpacity={1} 
                fill="url(#colorScore)" 
                activeDot={{ r: 6, fill: '#fbbf24', stroke: '#0f172a', strokeWidth: 2 }} 
             />
           </AreaChart>
         </ResponsiveContainer>
       </div>
       <p className="text-[11px] text-slate-500 mt-4 italic text-center">X-Axis: Years (Vimshottari Dasha) &nbsp;|&nbsp; Y-Axis: Predicted Experience (0-100) based on planetary dignity & Ashtakavarga.</p>
    </div>
  );
};

                      <div className="grid grid-cols-4 grid-rows-4 h-full w-full gap-1 p-1">
                        {rasiGridMap.map((cell) => (
                          <div key={cell.id} className={`relative flex flex-col p-2 border transition-all duration-300 ${cell.isLagnam ? 'border-amber-400/80 bg-amber-900/20 shadow-[inset_0_0_15px_rgba(251,191,36,0.15)]' : 'border-slate-700 bg-slate-800/40 hover:bg-slate-700/50'}`} style={{ gridColumnStart: cell.col, gridRowStart: cell.row }}>
                            <span className="text-[10px] uppercase text-slate-500 font-semibold mb-auto">{cell.label}</span>
                            {cell.isLagnam && <span className="absolute top-1 right-1 text-[9px] font-bold text-amber-400 bg-amber-400/10 px-1 rounded">Asc</span>}
                            <div className="text-sm font-bold text-indigo-200 mt-1 flex flex-wrap gap-1">
                              {cell.planets.split(', ').map((p, i) => (
                                p && <span key={i} className={`${p.includes('(R)') ? 'text-rose-300' : p === 'Mo' ? 'text-blue-300' : 'text-slate-200'}`}>{p}</span>
                              ))}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </GlassCard>
                </div>
              </section>

              {/* Comprehensive Analysis Accordions */}
              <section className="pb-12">
                <h3 className="text-sm font-semibold text-slate-500 uppercase tracking-widest mb-6 flex items-center gap-2">
                  <Calendar size={16} className="text-amber-400" /> Comprehensive Analysis
                </h3>
                <div className="max-w-4xl">
                  {reportData.map((item) => (
                    <AccordionItem key={item.id} item={item} isOpen={openAccordion === item.id} onClick={() => setOpenAccordion(openAccordion === item.id ? null : item.id)} />
                  ))}
                </div>
              </section>

              {/* Global Citation Footer */}
              <section className="pb-12 border-t border-slate-800/50 pt-8 mt-4 text-center max-w-4xl">
                <p className="text-xs text-slate-500 italic leading-relaxed">
                  Astrological calculations, yogas, doshas, and interpretations in this report are strictly based on the classical principles outlined in <strong className="text-slate-400">Brihat Parashara Hora Shastra (BPHS)</strong> and <strong className="text-slate-400">Phaladeepika</strong>. Planetary positions are computed using high-precision Swiss Ephemeris data with Lahiri (Chitra Paksha) Ayanamsa.
                </p>
                <p className="text-[10px] text-emerald-600/70 font-semibold mt-2 uppercase tracking-widest">Algorithmic Engine Verified against classical texts ✓</p>
              </section>
            </div>
          )}
        </div>
      </div>
    </>
  );
}

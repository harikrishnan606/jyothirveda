// ─── Master Computation ────────────────────────────────────
function computeChart(formData, lang = 'en') {
  try {
    const [year, month, day] = formData.dob.split('-').map(Number);
    const [hour, minute] = formData.time.split(':').map(Number);
    const lat = parseFloat(formData.lat);
    const lng = parseFloat(formData.lng);

    if (isNaN(year) || isNaN(month) || isNaN(day) || isNaN(hour) || isNaN(minute) || isNaN(lat) || isNaN(lng)) return null;

    // 1. Astronomical positions
    const positions = AstroEngine.computeAllPositions({
      year, month, day, hour, minute,
      tzOffset: 5.5, lat, lng
    });

    // 2. Build D1 chart
    const chart = VedicCore.buildChart(positions.sidereal);
    // Attach retrograde info to chart planets
    for (const [planet, retro] of Object.entries(positions.retrograde)) {
      if (chart.planets[planet]) chart.planets[planet].retrograde = retro;
    }
    // Attach combustion info
    for (const [planet, comb] of Object.entries(positions.combust)) {
      if (chart.planets[planet]) chart.planets[planet].combust = comb;
    }
    // Attach longitudes
    for (const [planet, long] of Object.entries(positions.sidereal)) {
      if (chart.planets[planet]) chart.planets[planet].longitude = long;
    }

    // 3. Build Navamsa chart
    const navamsaChart = VedicCore.buildNavamsaChart(positions.sidereal);

    // 4. Build grids for UI
    const rasiGrid = VedicCore.buildRasiGrid(chart);
    const navamsaGrid = VedicCore.buildRasiGrid(navamsaChart);

    // 5. Panchanga
    const panchanga = Panchanga.buildPanchanga(
      positions.sidereal.Sun, positions.sidereal.Moon, positions.jd
    );

    // 6. Dasha
    const dashaTimeline = DashaSystem.getMahaDashaTimeline(positions.jd, positions.sidereal.Moon);
    const now = new Date();
    const nowJD = AstroEngine.dateToJulianDay(
      now.getFullYear(), now.getMonth() + 1, now.getDate(),
      now.getHours(), now.getMinutes(), 5.5
    );
    const currentDasha = DashaSystem.getCurrentDasha(positions.jd, positions.sidereal.Moon, nowJD);

    // 7. Yogas & Doshas
    const yogaDoshaResults = YogaDosha.detectAll(chart, lang);

    // 8. Ashtakavarga
    const ashtakavargaResult = Ashtakavarga.compute(chart);

    // 9. Interpretations
    const personality = Interpretation.interpretPersonality(chart, yogaDoshaResults, lang);
    const career = Interpretation.interpretCareer(chart, lang);
    const wealth = Interpretation.interpretWealth(chart, ashtakavargaResult, lang);
    const remedies = Interpretation.interpretRemedies(chart, yogaDoshaResults, lang);
    const insights = Interpretation.generateInsights(chart, currentDasha, ashtakavargaResult, yogaDoshaResults, lang);
    const coreData = Interpretation.generateCoreData(chart, panchanga, currentDasha, lang);
    const lifePredictions = Interpretation.generateLifePredictions(chart, currentDasha, dashaTimeline, lang);

    return {
      positions, chart, navamsaChart, rasiGrid, navamsaGrid,
      panchanga, dashaTimeline, currentDasha,
      yogaDoshaResults, ashtakavargaResult,
      personality, career, wealth, remedies, insights, coreData, lifePredictions
    };
  } catch (e) {
    console.error('Chart computation error:', e);
    return null;
  }
}

  const radius = 24;
  const circumference = 2 * Math.PI * radius;
  const strokeDashoffset = circumference - (percentage / 100) * circumference;
  const colorClass = percentage > 75 ? 'text-green-400' : percentage > 50 ? 'text-amber-400' : 'text-rose-400';
  return (
    <div className="relative flex items-center justify-center h-16 w-16 shrink-0">
      <svg className="w-full h-full transform -rotate-90" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r={radius} stroke="currentColor" strokeWidth="4" fill="transparent" className="text-slate-800" />
        <circle cx="32" cy="32" r={radius} stroke="currentColor" strokeWidth="4" fill="transparent" strokeDasharray={circumference} strokeDashoffset={strokeDashoffset} className={`${colorClass} transition-all duration-1000 ease-out`} strokeLinecap="round" />
      </svg>
      <span className="absolute text-xs font-bold text-white">{percentage}%</span>
    </div>
  );
};

// ─── Place Autocomplete Component ───────────────────────────
function PlaceAutocomplete({ value, onSelect, onChangeText, t }) {
  const [query, setQuery] = useState(value);
  const [suggestions, setSuggestions] = useState([]);
  const [isOpen, setIsOpen] = useState(false);
  const debounceRef = useRef(null);

  useEffect(() => {
    setQuery(value);
  }, [value]);

  const searchPlace = (searchText) => {
    if (!searchText || searchText.length < 3) {
      setSuggestions([]);
      return;
    }
    fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(searchText)}&limit=5`)
      .then(res => res.json())
      .then(data => {
        if (data.features) {
          const results = data.features.map(f => ({
            name: [f.properties.name, f.properties.state, f.properties.country].filter(Boolean).join(', '),
            lat: f.geometry.coordinates[1],
            lng: f.geometry.coordinates[0]
          }));
          // Filter unique names
          const unique = results.filter((v, i, a) => a.findIndex(t => (t.name === v.name)) === i);
          setSuggestions(unique);
          setIsOpen(true);
        }
      })
      .catch(err => console.error('Geocoding error:', err));
  };

  const handleInputChange = (e) => {
    const text = e.target.value;
    setQuery(text);
    onChangeText(text); // Update parent state without lat/lng
    
    if (debounceRef.current) clearTimeout(debounceRef.current);
    debounceRef.current = setTimeout(() => {
      searchPlace(text);
    }, 500);
  };

  const handleSelect = (place) => {
    setQuery(place.name);
    setSuggestions([]);
    setIsOpen(false);
    onSelect(place.name, place.lat, place.lng);
  };

  return (
    <div className="relative">
      <Search size={16} className="absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-500" />
      <input 
        type="text" 
        value={query} 
        onChange={handleInputChange} 
        onBlur={() => setTimeout(() => setIsOpen(false), 200)}
        onFocus={() => { if (suggestions.length > 0) setIsOpen(true) }}
        className="w-full bg-slate-900/50 border border-slate-700 rounded-lg pl-10 pr-4 py-3 text-slate-200 focus:outline-none focus:border-amber-500/50 transition-all" 
        placeholder={t("Type a city name...")}
      />
      {isOpen && suggestions.length > 0 && (
        <ul className="absolute z-50 w-full mt-1 bg-slate-800 border border-slate-700 rounded-lg shadow-xl overflow-hidden">
          {suggestions.map((s, i) => (
            <li 
              key={i} 
              className="px-4 py-3 text-sm text-slate-300 hover:bg-amber-500/10 hover:text-amber-400 cursor-pointer border-b border-slate-700/50 last:border-0"
              onClick={() => handleSelect(s)}
            >
              {s.name}
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

const LifeGraph = ({ dashaTimeline, chart, ashtakavargaResult, lang = 'en' }) => {

             data={data}

           >
             <defs>
               <linearGradient id="colorScore" x1="0" y1="0" x2="0" y2="1">
                 <stop offset="5%" stopColor="#818cf8" stopOpacity={0.4}/>
                 <stop offset="95%" stopColor="#818cf8" stopOpacity={0}/>

             </defs>

             <XAxis dataKey="year" stroke="#94a3b8" tickFormatter={(val) => Math.floor(val)} tick={{fill: '#94a3b8', fontSize: 12}} tickMargin={10} minTickGap={30} />
             <YAxis domain={[0, 100]} stroke="#94a3b8" tick={{fill: '#94a3b8', fontSize: 12}} />
             <Tooltip content={<CustomTooltip />} />
             <ReferenceLine y={75} stroke="#10b981" strokeDasharray="3 3" opacity={0.5} label={{ position: 'insideTopRight', value: t('Excellent'), fill: '#10b981', fontSize: 10 }} />

                    })}

          );

      </div>
    </div>

};

                  <input type="date" name="dob" value={formData.dob} onChange={handleChange} className="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-3 text-slate-200 text-sm focus:outline-none focus:border-amber-500/50 transition-all" />
                </div>
                <div className="space-y-2">
                  <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-2"><Clock size={14} /> {t('Time of Birth')}</label>
                  <input type="time" name="time" value={formData.time} onChange={handleChange} className="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-3 text-slate-200 text-sm focus:outline-none focus:border-amber-500/50 transition-all" />
                </div>
              </div>

              <div className="space-y-2 relative">
                <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-2"><MapPin size={14} /> {t('Birth Place (City/Town)')}</label>
                <PlaceAutocomplete 
                  value={formData.place}
                  t={t}
                  onChangeText={(text) => handleChange({ target: { name: 'place', value: text } })}
                  onSelect={(placeName, lat, lng) => {
                    const newData = { ...formData, place: placeName, lat: String(lat), lng: String(lng) };
                    setFormData(newData);
                    if (sweReady) recalculate(newData);
                  }}
                />
              </div>

              <div className="grid grid-cols-2 gap-4 pt-2">
                <div className="space-y-1">
                  <label className="text-[10px] text-slate-500 uppercase tracking-wider">Latitude</label>
                  <input type="text" name="lat" value={formData.lat} onChange={handleChange} className="w-full bg-slate-900/80 border border-slate-800 rounded px-3 py-2 text-slate-400 text-xs text-center focus:outline-none focus:border-slate-600" />
                </div>
                <div className="space-y-1">
                  <label className="text-[10px] text-slate-500 uppercase tracking-wider">Longitude</label>
                  <input type="text" name="lng" value={formData.lng} onChange={handleChange} className="w-full bg-slate-900/80 border border-slate-800 rounded px-3 py-2 text-slate-400 text-xs text-center focus:outline-none focus:border-slate-600" />
                </div>
              </div>
            </div>

            <div className="mt-8 space-y-4">
              <button 
                onClick={saveProfile}
                className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold rounded-xl transition-all shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2"
              >
                <CheckCircle size={18} /> {t('Save Profile')}
              </button>
              
              {history.length > 0 && (
                <div className="p-4 rounded-xl bg-slate-900/50 border border-slate-700">
                  <h4 className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 flex items-center gap-2"><Clock size={14} /> {t('Saved Profiles')}</h4>
                  <div className="space-y-2 max-h-48 overflow-y-auto pr-2 custom-scrollbar">
                    {history.map((h, i) => (
                      <div 
                        key={i}
                        onClick={() => loadProfile(h)}
                        className="flex items-center justify-between p-3 rounded-lg bg-slate-800 hover:bg-slate-700 cursor-pointer border border-slate-700 transition-colors group"
                      >
                        <div className="flex-1 min-w-0">
                          <p className="text-sm font-medium text-slate-200 truncate">{h.name}</p>
                          <p className="text-xs text-slate-400 truncate">{h.dob.split('-').reverse().join('/')} • {h.place.split(',')[0]}</p>
                        </div>
                        <button 
                          onClick={(e) => deleteProfile(e, i)}
                          className="p-2 text-slate-500 hover:text-rose-400 opacity-0 group-hover:opacity-100 transition-all"
                        >
                          <XCircle size={16} />
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>

            <div className="mt-4 p-4 rounded-xl bg-indigo-500/5 border border-indigo-500/20 text-center">
              <p className="text-xs text-indigo-300 flex items-center justify-center gap-2">
                <Activity size={14} className="animate-pulse" />
                {t('Results update automatically as you type.')}
              </p>
            </div>

            {/* Calculation method badge */}
            {cr && (
              <div className="mt-4 p-3 rounded-lg bg-slate-900/50 border border-slate-800 text-[10px] text-slate-500 space-y-1">
                <p>{t('Engine')}: {cr.positions.method}</p>
                <p>{t('Ayanamsa')}: {cr.positions.ayanamsaType} ({cr.positions.ayanamsa.toFixed(4)}°)</p>
                <p>{t('Houses')}: {t('Whole-sign (Rāśi = Bhāva)')}</p>
                <p>ΔT: ~{cr.positions.deltaT.toFixed(1)}s</p>
              </div>
            )}
          </div>
        </div>

        {/* ═══ MAIN CONTENT ═══ */}
        <div className="flex-1 relative w-full h-auto lg:h-full lg:overflow-y-auto scroll-smooth">

          {/* Loading overlay */}
          <div className={`absolute inset-0 z-10 bg-[#0B1021]/60 backdrop-blur-sm transition-all duration-500 flex items-center justify-center pointer-events-none ${isCalculating ? 'opacity-100' : 'opacity-0'}`}>
            <div className="flex flex-col items-center gap-4 p-8 rounded-2xl bg-slate-900/80 border border-slate-700 shadow-2xl">
              <div className="relative w-16 h-16">
                <div className="absolute inset-0 rounded-full border-4 border-amber-500/20"></div>
                <div className="absolute inset-0 rounded-full border-4 border-amber-400 border-t-transparent animate-spin"></div>
                <Star className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-amber-400 animate-pulse" size={20} />
              </div>
              <p className="text-amber-400 text-sm font-medium tracking-widest uppercase animate-pulse">{t('Computing Positions...')}</p>
            </div>
          </div>

          {cr && (
            <div className="p-6 md:p-10 lg:p-12 max-w-6xl mx-auto space-y-12">

              {/* Header */}
              <header className="flex flex-col md:flex-row md:items-end justify-between gap-4 border-b border-slate-800 pb-6">
                <div>
                  <h2 className="text-3xl md:text-4xl font-serif text-white mb-2">{t('Cosmic Blueprint')}</h2>
                  <p className="text-slate-400 flex items-center gap-2">
                    <User size={16} /> {formData.name} <span className="text-slate-600">•</span>
                    <MapPin size={16} /> {formData.place}
                  </p>
                </div>
                <div className="text-right">
                  <div className="inline-block px-4 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold uppercase tracking-wider">
                    {t('Live Computation')}
                  </div>
                </div>
              </header>

              {/* High-Probability Keywords */}
              <section className="mb-10">
                <h3 className="text-sm font-semibold text-slate-500 uppercase tracking-widest mb-4 flex items-center gap-2">
                  <Sparkles size={16} className="text-amber-400" /> {t('Top Cosmic Signatures')}
                </h3>
                <div className="flex flex-wrap gap-3">
                  {[
                    ...insightsData.map(i => ({ text: i.keyword, prob: i.probability, icon: i.icon, type: 'prediction' })),
                    ...(cr.personality.keywords || []).map(k => ({ text: k.text, prob: 95, icon: ICON_MAP[k.icon] || Star, type: 'trait' }))
                  ].sort((a, b) => b.prob - a.prob).map((kw, idx) => (
                    <div key={idx} className="flex items-center gap-2 px-4 py-2 bg-slate-800/80 border border-slate-700/50 rounded-full hover:bg-slate-700 transition-colors shadow-lg">
                      <kw.icon size={14} className={kw.type === 'trait' ? 'text-indigo-400' : 'text-amber-400'} />
                      <span className="text-sm font-medium text-slate-200">{kw.text}</span>
                      <span className="text-[10px] text-slate-500 font-bold ml-1">{kw.prob}%</span>
                    </div>
                  ))}
                </div>
              </section>

              {/* Core Data + Chart Grid */}
              <section className="grid grid-cols-1 xl:grid-cols-12 gap-8">
                <div className="xl:col-span-5 space-y-6">
                  <h3 className="text-sm font-semibold text-slate-500 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <Moon size={16} className="text-amber-400" /> {t('Core Jyothisha Data')}
                  </h3>
                  <GlassCard className="p-6 divide-y divide-slate-700/50">
                    {[
                      [t('Janma Rasi (Moon)'), coreData.janmaRasi],
                      [t('Janma Nakshatra'), coreData.janmaNakshatra],
                      [lang === 'ml' ? 'നക്ഷത്ര ഗണം / സ്വഭാവം' : 'Nakshatra Gana/Quality', `${coreData.nakshatraGana} — ${coreData.nakshatraQuality}`],
                      [lang === 'ml' ? 'നക്ഷത്ര ദേവത' : 'Nakshatra Deity', coreData.nakshatraDeity],
                      [t('Lagnam (Ascendant)'), coreData.lagnam, true],
                      [t('Tithi'), coreData.tithi],
                      [t('Vara'), coreData.vara],
                      [t('Yoga'), coreData.yoga],
                      [t('Karana'), coreData.karana],
                      [t('Current Dasha'), coreData.currentDasha, false, true]
                    ].map(([label, value, isHighlight, isDasha], i) => (
                      <div key={i} className="flex justify-between items-center py-3">
                        <span className="text-slate-400 text-sm">{label}</span>
                        <span className={`font-medium text-right ${isHighlight ? 'text-amber-400 font-bold bg-amber-400/10 px-2 py-0.5 rounded' : isDasha ? 'text-indigo-300' : 'text-white'}`}>{value}</span>
                      </div>
                    ))}
                  </GlassCard>

                  <div className="flex flex-wrap gap-3 text-xs text-slate-400 bg-slate-900/50 p-4 rounded-xl">
                    <div className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-amber-400"></span> {t('Lagnam')}</div>
                    <div className="flex items-center gap-1"><span className="text-indigo-400 font-bold">{t('Ju')}(R)</span> {t('Retrograde')}</div>
                    <div className="flex items-center gap-1">{lang === 'ml' ? 'സൂ: സൂര്യൻ, ച: ചന്ദ്രൻ, ചൊ: ചൊവ്വ...' : 'Su: Sun, Mo: Moon, Ma: Mars...'}</div>
                  </div>
                </div>

                {/* Rasi / Navamsa Chart */}
                <div className="xl:col-span-7">
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="text-sm font-semibold text-slate-500 uppercase tracking-widest flex items-center gap-2">
                      <Sun size={16} className="text-amber-400" /> {t('Divisional Charts')}
                    </h3>
                    <div className="flex bg-slate-800 rounded-lg p-1 border border-slate-700">
                      <button onClick={() => setActiveChartTab('rasi')} className={`px-4 py-1.5 text-xs font-medium rounded-md transition-colors ${activeChartTab === 'rasi' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}>{t('Rasi Chart')}</button>
                      <button onClick={() => setActiveChartTab('navamsa')} className={`px-4 py-1.5 text-xs font-medium rounded-md transition-colors ${activeChartTab === 'navamsa' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}>{t('Navamsa Chart')}</button>
                    </div>
                  </div>

                  <GlassCard className="p-6 md:p-8 flex items-center justify-center bg-slate-900/80">
                    <div className="w-full max-w-md aspect-square relative">
                      <div className="absolute inset-0 m-auto w-[48%] h-[48%] flex flex-col items-center justify-center text-slate-600 border border-slate-800 rounded-xl bg-[#0B1021]">
                        <Star size={32} className="opacity-20 mb-2" />
                        <span className="font-serif text-lg tracking-widest uppercase opacity-40">{activeChartTab === 'rasi' ? t('Rasi') : t('Navamsa')}</span>
                        <span className="text-xs mt-1 opacity-30">{t('South Indian Style')}</span>
                      </div>

                      <div className="grid grid-cols-4 grid-rows-4 h-full w-full gap-1 p-1">
                        {rasiGridMap.map((cell) => (
                          <div key={cell.id} className={`relative flex flex-col p-2 border transition-all duration-300 ${cell.isLagnam ? 'border-amber-400/80 bg-amber-900/20 shadow-[inset_0_0_15px_rgba(251,191,36,0.15)]' : 'border-slate-700 bg-slate-800/40 hover:bg-slate-700/50'}`} style={{ gridColumnStart: cell.col, gridRowStart: cell.row }}>
                            <span className="text-[10px] uppercase text-slate-500 font-semibold mb-auto">{t(cell.label)}</span>
                            {cell.isLagnam && <span className="absolute top-1 right-1 text-[9px] font-bold text-amber-400 bg-amber-400/10 px-1 rounded">{t('Asc')}</span>}
                            <div className="text-sm font-bold text-indigo-200 mt-1 flex flex-wrap gap-1">
                              {cell.planets.split(', ').map((p, i) => {
                                if (!p) return null;
                                const isR = p.includes('(R)');
                                const pCode = isR ? p.replace('(R)', '').trim() : p.trim();
                                const pText = `${t(pCode)}${isR ? (lang === 'ml' ? ' (വക്ര)' : ' (R)') : ''}`;
                                return (
                                  <span key={i} className={`${isR ? 'text-rose-300' : pCode === 'Mo' ? 'text-blue-300' : 'text-slate-200'}`}>{pText}</span>
                                );
                              })}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </GlassCard>
                </div>
              </section>

              {/* Comprehensive Analysis Accordions */}
              <section className="pb-12">
                <h3 className="text-sm font-semibold text-slate-500 uppercase tracking-widest mb-6 flex items-center gap-2">
                  <Calendar size={16} className="text-amber-400" /> {t('Comprehensive Analysis')}
                </h3>
                <div className="max-w-4xl">
                  {reportData.map((item) => (
                    <AccordionItem key={item.id} item={item} isOpen={openAccordion === item.id} onClick={() => setOpenAccordion(openAccordion === item.id ? null : item.id)} />
                  ))}
                </div>
              </section>

              {/* Global Citation Footer */}
              <section className="pb-12 border-t border-slate-800/50 pt-8 mt-4 text-center max-w-4xl">
                <p className="text-xs text-slate-500 italic leading-relaxed">
                  {lang === 'ml' ? (
                    <>ഈ റിപ്പോർട്ടിലെ ജ്യോതിഷ ഗണിതങ്ങളും യോഗങ്ങളും ദോഷങ്ങളും വ്യാഖ്യാനങ്ങളും <strong className="text-slate-400">ബൃഹത് പരാശര ഹോര ശാസ്ത്രം (BPHS)</strong>, <strong className="text-slate-400">ഫലദീപിക</strong> തുടങ്ങിയ പ്രാചീന ഗ്രന്ഥങ്ങളിലെ ശാസ്ത്രീയ തത്വങ്ങളെ അടിസ്ഥാനമാക്കിയുള്ളതാണ്. ചിത്രാപക്ഷ (ലാഹിരി) അയനാംശവും അതീവ സൂക്ഷ്മമായ സ്വിസ് എഫെമെറിസ് (Swiss Ephemeris) വിവരങ്ങളും ഉപയോഗിച്ചാണ് ഗ്രഹനില കണക്കുകൂട്ടിയിരിക്കുന്നത്.</>
                  ) : (
                    <>Astrological calculations, yogas, doshas, and interpretations in this report are strictly based on the classical principles outlined in <strong className="text-slate-400">Brihat Parashara Hora Shastra (BPHS)</strong> and <strong className="text-slate-400">Phaladeepika</strong>. Planetary positions are computed using high-precision Swiss Ephemeris data with Lahiri (Chitra Paksha) Ayanamsa.</>
                  )}
                </p>
                <p className="text-[10px] text-emerald-600/70 font-semibold mt-2 uppercase tracking-widest">
                  {lang === 'ml' ? 'പ്രാചീന ഗ്രന്ഥങ്ങളുമായി ഒത്തുനോക്കി ഉറപ്പുവരുത്തിയ കമ്പ്യൂട്ടർ അൽഗോരിതം ✓' : 'Algorithmic Engine Verified against classical texts ✓'}
                </p>
              </section>
            </div>
          )}
        </div>
      </div>
    </>
  );
}

const root = createRoot(document.getElementById('root'));
root.render(<JyothishamApp />);
    </script>
</body>
</html>
